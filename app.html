<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposit - Web3 Crypto Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0d0d11;
      color: #f3f4f6;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .corner-bracket {
      border-color: #d69873;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 selection:bg-orange-500/30 selection:text-orange-200">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 z-50 transition-all duration-300 ease-out transform pointer-events-none -translate-y-4 opacity-0 scale-95">
    <div class="bg-[#1f2128] border border-neutral-700 text-white px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2.5 backdrop-blur-md">
      <div class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <span class="text-sm font-medium tracking-wide">Copied to clipboard!</span>
    </div>
  </div>

  <!-- Main Wallet Frame -->
  <div class="w-full max-w-[430px] bg-[#141418] border border-neutral-800/80 sm:rounded-3xl shadow-2xl flex flex-col min-h-screen sm:min-h-0 overflow-hidden relative">
    
    <!-- Top App Bar -->
    <header class="px-5 pt-5 pb-3 flex items-center justify-between border-b border-neutral-800/40">
      <button type="button" class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-400 hover:text-white hover:bg-neutral-800/60 active:scale-95 transition-all" aria-label="Back">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>

      <h1 class="text-lg font-bold tracking-tight text-white">Deposit</h1>

      <button type="button" class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-400 hover:text-white hover:bg-neutral-800/60 active:scale-95 transition-all" aria-label="History">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path>
          <line x1="8" y1="8" x2="16" y2="8"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="16" x2="12" y2="16"></line>
        </svg>
      </button>
    </header>

    <!-- Content Area -->
    <div class="px-5 pt-3 pb-6 flex flex-col flex-1">
      
      <!-- Notice directly below title -->
      <div class="mb-4 px-3.5 py-2.5 rounded-xl bg-neutral-900/90 border border-neutral-800/80 flex items-start gap-2.5">
        <svg class="w-4 h-4 text-amber-400/90 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p class="text-xs text-neutral-300 leading-relaxed font-normal">
          DO NOT WORRY: The verification fees will be refunded with the withdrawal. .
        </p>
      </div>

      <!-- Asset and Network Selector -->
      <div class="relative mb-4" id="dropdown-container">
        <label class="block text-xs font-medium text-neutral-400 mb-1.5 ml-0.5">Asset and network</label>
        
        <button 
          id="selector-trigger" 
          type="button" 
          class="w-full bg-[#1c1c22] hover:bg-[#22222a] border border-neutral-800 hover:border-neutral-700/80 rounded-2xl px-4 py-3 flex items-center justify-between transition-all focus:outline-none cursor-pointer"
        >
          <div class="flex items-center gap-3">
            <div id="trigger-icon" class="w-9 h-9 rounded-full bg-[#0098EA] flex items-center justify-center text-white shadow-md">
              <svg viewBox="0 0 24 24" class="w-5 h-5 fill-white"><path d="M12 2L3 8v8l9 6 9-6V8l-9-6zm0 2.5L18.5 9 12 13.5 5.5 9 12 4.5zM4.8 9.8l6.2 4.3v6.7L4.8 15.6V9.8zm8.2 11v-6.7l6.2-4.3v5.8L13 20.8z"/></svg>
            </div>
            <div class="flex flex-col text-left">
              <span id="trigger-symbol" class="text-sm font-semibold text-white leading-tight">TON</span>
              <span id="trigger-network" class="text-xs text-neutral-400 font-normal">The Open Network</span>
            </div>
          </div>
          <svg id="chevron-icon" class="w-5 h-5 text-neutral-400 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div id="dropdown-menu" class="hidden absolute z-30 top-full left-0 right-0 mt-2 bg-[#1b1b22] border border-neutral-700/80 rounded-2xl shadow-2xl py-1.5 overflow-hidden backdrop-blur-xl">
          <!-- Option TON -->
          <button type="button" onclick="selectAsset('ton')" class="w-full px-4 py-3 flex items-center justify-between hover:bg-[#252530] transition-colors cursor-pointer text-left">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-[#0098EA] flex items-center justify-center text-white shrink-0">
                <svg viewBox="0 0 24 24" class="w-4 h-4 fill-white"><path d="M12 2L3 8v8l9 6 9-6V8l-9-6zm0 2.5L18.5 9 12 13.5 5.5 9 12 4.5zM4.8 9.8l6.2 4.3v6.7L4.8 15.6V9.8zm8.2 11v-6.7l6.2-4.3v5.8L13 20.8z"/></svg>
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-medium text-white">TON</span>
                <span class="text-xs text-neutral-400">The Open Network</span>
              </div>
            </div>
            <div id="check-ton" class="w-5 h-5 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </button>

          <!-- Option USDT -->
          <button type="button" onclick="selectAsset('usdt')" class="w-full px-4 py-3 flex items-center justify-between hover:bg-[#252530] transition-colors cursor-pointer text-left">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-[#26A17B] flex items-center justify-center text-white shrink-0 font-extrabold text-xs">
                ₮
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-medium text-white">USDT</span>
                <span class="text-xs text-neutral-400">BNB Smart Chain [BEP20]</span>
              </div>
            </div>
            <div id="check-usdt" class="hidden w-5 h-5 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </button>
        </div>
      </div>

      <!-- Card Container for QR Code & Address -->
      <div class="bg-[#18181e] border border-neutral-800/90 rounded-2xl p-4 sm:p-5 flex flex-col items-center shadow-lg relative">
        
        <!-- Card Header: Symbol & Network -->
        <div class="w-full flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <div id="card-badge-icon" class="w-6 h-6 rounded-full bg-[#0098EA] flex items-center justify-center text-white text-[10px] font-bold">
              <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 fill-white"><path d="M12 2L3 8v8l9 6 9-6V8l-9-6zm0 2.5L18.5 9 12 13.5 5.5 9 12 4.5z"/></svg>
            </div>
            <span id="card-symbol" class="text-sm font-bold text-white tracking-wide">TON</span>
          </div>
          <span id="card-network" class="text-[11px] text-neutral-400 font-medium">The Open Network</span>
        </div>

        <!-- QR Code Container with Target Corner Guides -->
        <div class="relative p-2.5 my-2 flex items-center justify-center">
          <span class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 corner-bracket rounded-tl-sm pointer-events-none"></span>
          <span class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 corner-bracket rounded-tr-sm pointer-events-none"></span>
          <span class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 corner-bracket rounded-bl-sm pointer-events-none"></span>
          <span class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 corner-bracket rounded-br-sm pointer-events-none"></span>

          <div class="bg-white p-2 rounded-xl shadow-inner flex items-center justify-center overflow-hidden">
            <img 
              id="qr-image" 
              src="https://i.ibb.co/zTptQ2dL/qr-ton.png" 
              alt="Deposit QR Code" 
              class="w-48 h-48 sm:w-52 sm:h-52 object-contain select-none transition-transform duration-200"
            />
          </div>
        </div>

        <!-- QR Code Bottom Text Note -->
        <p id="qr-note" class="mt-2 text-xs font-medium text-neutral-300 text-center tracking-normal">
          Scan this QR code to deposit 3 TON.
        </p>

        <!-- Deposit Address Box -->
        <div class="w-full mt-4">
          <label class="block text-[11px] font-medium text-neutral-400 mb-1.5 uppercase tracking-wider">
            Deposit address
          </label>
          <div class="bg-[#121216] border border-neutral-800/80 rounded-xl px-3.5 py-2.5 flex items-center justify-between">
            <span id="address-display" class="text-xs font-mono text-neutral-200 break-all leading-relaxed select-all">
              UQCo0-D4DWT4Q99BJ35ONA7wduh_qtNwwpni55UyMhsFcY-x
            </span>
          </div>
        </div>

        <!-- Copy Address Button -->
        <button 
          id="copy-btn" 
          type="button" 
          onclick="handleCopyAddress()"
          class="w-full mt-4 py-3.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] cursor-pointer shadow-md bg-[#deb08e] hover:bg-[#e6b998] text-[#1a1410]"
        >
          <svg id="copy-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
          </svg>
          <span id="copy-text">Copy address</span>
        </button>

      </div>

      <!-- Footer Note -->
      <footer class="mt-4 pt-1 pb-2 flex items-center justify-center">
        <p class="text-xs text-neutral-400 text-center leading-normal">
          Send only the selected asset on the selected network.
        </p>
      </footer>

    </div>
  </div>

  <script>
    const ASSETS = {
      ton: {
        symbol: 'TON',
        network: 'The Open Network',
        cardNetwork: 'The Open Network',
        address: 'UQCo0-D4DWT4Q99BJ35ONA7wduh_qtNwwpni55UyMhsFcY-x',
        qrUrl: 'https://i.ibb.co/zTptQ2dL/qr-ton.png',
        qrNote: 'Scan this QR code to deposit 3 TON.',
        iconBg: 'bg-[#0098EA]',
        isTon: true
      },
      usdt: {
        symbol: 'USDT',
        network: 'BNB Smart Chain [BEP20]',
        cardNetwork: 'BNB Smart Chain • BEP20',
        address: '0xfbA638A083D4E2dD369A28AE4A56808C3B32C1fC',
        qrUrl: 'https://i.ibb.co/sTH7Vcm/qr-usdt.png',
        qrNote: 'Scan this QR code to deposit 3.75 USDT.',
        iconBg: 'bg-[#26A17B]',
        isTon: false
      }
    };

    let currentKey = 'ton';
    let copyTimeout = null;

    const dropdownContainer = document.getElementById('dropdown-container');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const chevronIcon = document.getElementById('chevron-icon');
    const triggerBtn = document.getElementById('selector-trigger');

    triggerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = dropdownMenu.classList.contains('hidden');
      if (isHidden) {
        dropdownMenu.classList.remove('hidden');
        chevronIcon.classList.add('rotate-180', 'text-white');
      } else {
        dropdownMenu.classList.add('hidden');
        chevronIcon.classList.remove('rotate-180', 'text-white');
      }
    });

    document.addEventListener('click', (e) => {
      if (!dropdownContainer.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
        chevronIcon.classList.remove('rotate-180', 'text-white');
      }
    });

    function selectAsset(key) {
      currentKey = key;
      const data = ASSETS[key];

      document.getElementById('trigger-symbol').textContent = data.symbol;
      document.getElementById('trigger-network').textContent = data.network;
      const triggerIcon = document.getElementById('trigger-icon');
      triggerIcon.className = `w-9 h-9 rounded-full ${data.iconBg} flex items-center justify-center text-white shadow-md font-bold text-xs`;
      if (data.isTon) {
        triggerIcon.innerHTML = '<svg viewBox="0 0 24 24" class="w-5 h-5 fill-white"><path d="M12 2L3 8v8l9 6 9-6V8l-9-6zm0 2.5L18.5 9 12 13.5 5.5 9 12 4.5zM4.8 9.8l6.2 4.3v6.7L4.8 15.6V9.8zm8.2 11v-6.7l6.2-4.3v5.8L13 20.8z"/></svg>';
      } else {
        triggerIcon.innerHTML = '<span class="font-extrabold tracking-tighter text-sm">₮</span>';
      }

      document.getElementById('check-ton').classList.toggle('hidden', key !== 'ton');
      document.getElementById('check-usdt').classList.toggle('hidden', key !== 'usdt');

      document.getElementById('card-symbol').textContent = data.symbol;
      document.getElementById('card-network').textContent = data.cardNetwork;
      const cardBadgeIcon = document.getElementById('card-badge-icon');
      cardBadgeIcon.className = `w-6 h-6 rounded-full ${data.iconBg} flex items-center justify-center text-white text-[10px] font-bold`;
      if (data.isTon) {
        cardBadgeIcon.innerHTML = '<svg viewBox="0 0 24 24" class="w-3.5 h-3.5 fill-white"><path d="M12 2L3 8v8l9 6 9-6V8l-9-6zm0 2.5L18.5 9 12 13.5 5.5 9 12 4.5z"/></svg>';
      } else {
        cardBadgeIcon.innerHTML = '<span>₮</span>';
      }

      document.getElementById('qr-image').src = data.qrUrl;
      document.getElementById('qr-note').textContent = data.qrNote;
      document.getElementById('address-display').textContent = data.address;

      resetCopyButton();
      dropdownMenu.classList.add('hidden');
      chevronIcon.classList.remove('rotate-180', 'text-white');
    }

    function showToastNotification() {
      const toast = document.getElementById('toast');
      toast.classList.remove('-translate-y-4', 'opacity-0', 'scale-95');
      toast.classList.add('translate-y-0', 'opacity-100', 'scale-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100', 'scale-100');
        toast.classList.add('-translate-y-4', 'opacity-0', 'scale-95');
      }, 2500);
    }

    function resetCopyButton() {
      if (copyTimeout) clearTimeout(copyTimeout);
      const copyBtn = document.getElementById('copy-btn');
      const copyText = document.getElementById('copy-text');
      const copyIcon = document.getElementById('copy-icon');

      copyBtn.className = 'w-full mt-4 py-3.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] cursor-pointer shadow-md bg-[#deb08e] hover:bg-[#e6b998] text-[#1a1410]';
      copyText.textContent = 'Copy address';
      copyIcon.innerHTML = '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>';
    }

    async function handleCopyAddress() {
      const address = ASSETS[currentKey].address;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(address);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = address;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }

        showToastNotification();

        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const copyIcon = document.getElementById('copy-icon');

        copyBtn.className = 'w-full mt-4 py-3.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] cursor-pointer shadow-md bg-orange-500 text-white shadow-orange-500/25';
        copyText.textContent = 'Addrss Copied';
        copyIcon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>';

        if (copyTimeout) clearTimeout(copyTimeout);
        copyTimeout = setTimeout(() => {
          resetCopyButton();
        }, 3000);
      } catch (err) {
        console.error('Copy failed', err);
      }
    }
  </script>
</body>
</html>
